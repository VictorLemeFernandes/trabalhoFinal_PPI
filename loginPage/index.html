<!-- TÓPICO 2.3 -> PÁGINA DE LOGIN -->

<body>
    <div class="header">
        <img src="/loginPage/img/webcar branco.png" alt="Logo" class="logo">
    </div>
    <div class="container">
        <h1>Login</h1>
        <form action="login.php" method="post">
            <div>
                <input type="email" id="email" name="email" required placeholder="E-mail">
            </div>
            <div>
                <input type="password" id="senha" name="senha" required placeholder="Senha">
            </div>

            <div>
                <button type="submit">
                    Entrar
                    <span class="material-symbols-outlined">login</span>
                </button>
            </div>

            <div>
                <a href="/signUpPage/index.html">Não tem uma conta? Cadastre-se</a>
            </div>
        </form>
    </div>
</body>

</html>
