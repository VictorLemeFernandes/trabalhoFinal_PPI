<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles/loginAndSignUpPage.css">
  <title>Cadastro</title>
</head>

<!-- TÓPICO 2.3 -> PÁGINA DE CADASTRO -->

<body>
  <div class="header">
    <img src="/assets/webcar branco.png" alt="Logo" class="logo">
  </div>
  <div class="container">
    <h1>Cadastro</h1>
    <!--Prestar atencao nessas action-->
    <form action="../../arquivosPHP/controller.php?acao=cadastrarAnunciante" method="POST">
      <div>
        <input type="text" id="nome" name="nome" required placeholder="Nome">
      </div>

      <div>
        <input type="text" id="cpf" name="cpf" required placeholder="CPF" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
      </div>

      <div>
        <input type="email" id="email" name="email" required placeholder="E-mail" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
      </div>

      <div>
        <input type="password" id="senha" name="senha" required placeholder="Senha">
      </div>

      <div>
        <input type="tel" id="telefone" name="telefone" required placeholder="Telefone" required pattern="\(\d{2}\) \d{5}-\d{4}">
      </div>

      <div>
        <a href="/pages/loginPage/index.html" class="btn-entrar">
          Cadastrar
          <span class="material-symbols-outlined"></span>
        </a>
      </div>


      <div> <a href="/pages/loginPage/index.html">Já tenho uma conta</a></div>
    </form>
  </div>

  <script src="/pages/signUpPage/formValidator.js"></script>
</body>

</html>
