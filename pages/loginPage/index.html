<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/styles/loginAndSignUpPage.css">

<!-- TÓPICO 2.3 -> PÁGINA DE LOGIN -->

<body>
    <div class="header">
        <img src="/assets/webcar branco.png" alt="Logo" class="logo">
    </div>
    <div>
        <a href="/pages/mainPage/mainPage_2_1.html" class="voltar">Voltar</a>
    </div>
    <div class="container">

        <h1>Login</h1>
        <form action="/pages/mainPage/mainPage_2_5.html">
            <div>
                <input type="email" id="email" name="email" placeholder="E-mail">
            </div>
            <div>
                <input type="password" id="senha" name="senha" placeholder="Senha">
            </div>

            <div>
                <a href="/pages/mainPage/mainPage_2_5.html" class="btn-entrar">
                    Entrar
                    <span class="material-symbols-outlined">login</span>
                </a>
            </div>

            <div>
                <a href="/pages/signUpPage/index.html">Não tem uma conta? Cadastre-se</a>
            </div>
        </form>
    </div>
