<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles/loginAndSignUpPage.css">
  <title>Cadastro</title>
</head>

<!-- TÓPICO 2.3 -> PÁGINA DE CADASTRO -->

<body>
  <div class="header">
    <img src="/assets/webcar branco.png" alt="Logo" class="logo">
  </div>
  <div class="container">
    <h1>Cadastro</h1>
    <form action="signup.php" method="post">
      <div>
        <input type="text" id="nome" name="nome" required placeholder="Nome">
      </div>

      <div>
        <input type="text" id="cpf" name="cpf" required placeholder="CPF">
      </div>

      <div>
        <input type="email" id="email" name="email" required placeholder="E-mail">
      </div>

      <div>
        <input type="password" id="senha" name="senha" required placeholder="Senha">
      </div>

      <div>
        <input type="tel" id="telefone" name="telefone" required placeholder="Telefone">
      </div>

      <div>
        <button type="submit">Cadastrar</button>
      </div>

      <div> <a href="/loginPage/index.html">Já tenho uma conta</a></div>
    </form>
</body>

</html>
